name: Style maintenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/style-maintenance.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install formatting tools
        run: |
          python -m pip install 'ruff>=0.8,<1'
          npm install --prefix frontend --no-audit --no-fund
      - name: Apply safe lint fixes and formatting on hosted runner
        run: |
          python -m ruff check --fix --exit-zero backend
          python -m ruff format backend
          cd frontend
          npm run format
      - name: Publish formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app backend/tests frontend/src frontend/tests
          if ! git diff --cached --quiet; then
            git commit -m 'Apply hosted safe lint fixes and formatting'
            git push origin HEAD:main
          fi
