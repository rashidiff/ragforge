name: CI

on:
  push:
  pull_request:
  workflow_run:
    workflows: [Style maintenance]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "./backend[dev,ci]"

      - name: Run backend tests
        env:
          RAG_DATA_DIR: ${{ runner.temp }}/local-rag-chat-ci-data
        working-directory: backend
        run: python -m pytest -q tests

      - name: Lint backend
        if: ${{ !cancelled() }}
        run: python -m ruff check backend

      - name: Check backend formatting
        if: ${{ !cancelled() }}
        run: python -m ruff format --check backend

      - name: Type check backend
        if: ${{ !cancelled() }}
        run: python -m mypy backend/app

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Install Chromium for browser integration tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run mocked browser integration tests
        working-directory: frontend
        run: npm run test:e2e:ci

      - name: Lint frontend
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run format:check

      - name: Type check frontend
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run build

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failures
          path: frontend/test-results/
          if-no-files-found: ignore
